<title>NOVALIB | Books</title>

<!-- Google Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Poppins', sans-serif;
        background: #f5f7fb;
        color: #172033;
    }

    /* NAVBAR */
    .navbar {
        background: #0b1f3a;
        padding: 18px 7%;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .logo {
        color: #d4af37;
        font-family: 'DM Serif Display', serif;
        font-size: 30px;
        letter-spacing: 2px;
    }

    .nav-links {
        display: flex;
        gap: 28px;
        list-style: none;
    }

    .nav-links a {
        color: white;
        text-decoration: none;
        font-size: 14px;
        transition: 0.3s;
    }

    .nav-links a:hover,
    .nav-links .active {
        color: #d4af37;
    }

    /* HERO */
    .books-hero {
        background: linear-gradient(135deg, #0b1f3a, #16365f);
        padding: 55px 7%;
        color: white;
    }

    .books-hero h1 {
        font-family: 'DM Serif Display', serif;
        font-size: 45px;
        margin-bottom: 10px;
    }

    .books-hero p {
        color: #d8deea;
        font-size: 15px;
    }

    /* MAIN */
    .container {
        width: 86%;
        max-width: 1250px;
        margin: 40px auto;
    }

    /* ADD BOOK CARD */
    .card {
        background: white;
        padding: 30px;
        border-radius: 18px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
        margin-bottom: 30px;
    }

    .card-title {
        font-family: 'DM Serif Display', serif;
        font-size: 26px;
        color: #0b1f3a;
        margin-bottom: 22px;
    }

    .form-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
    }

    .form-group input {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid #dfe3ea;
        border-radius: 10px;
        outline: none;
        font-family: 'Poppins', sans-serif;
        transition: 0.3s;
    }

    .form-group input:focus {
        border-color: #d4af37;
        box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.12);
    }

    .add-btn {
        margin-top: 20px;
        padding: 13px 25px;
        border: none;
        border-radius: 10px;
        background: #d4af37;
        color: #0b1f3a;
        font-weight: 700;
        cursor: pointer;
        font-family: 'Poppins', sans-serif;
        transition: 0.3s;
    }

    .add-btn:hover {
        transform: translateY(-2px);
        background: #c49f2f;
    }

    /* BOOK LIST HEADER */
    .list-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 20px;
    }

    .search-box {
        width: 300px;
        padding: 13px 18px;
        border: 1px solid #dfe3ea;
        border-radius: 10px;
        outline: none;
        font-family: 'Poppins', sans-serif;
    }

    .search-box:focus {
        border-color: #d4af37;
    }

    /* TABLE */
    .table-wrapper {
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        min-width: 850px;
    }

    thead {
        background: #0b1f3a;
        color: white;
    }

    th {
        padding: 16px;
        text-align: left;
        font-size: 13px;
        font-weight: 600;
    }

    td {
        padding: 15px 16px;
        border-bottom: 1px solid #edf0f4;
        font-size: 13px;
    }

    tbody tr {
        transition: 0.2s;
    }

    tbody tr:hover {
        background: #faf9f2;
    }

    /* MOBILE */
    @media (max-width: 900px) {

        .form-grid {
            grid-template-columns: repeat(2, 1fr);
        }

        .nav-links {
            gap: 15px;
        }

    }

    @media (max-width: 600px) {

        .navbar {
            flex-direction: column;
            gap: 15px;
        }

        .nav-links {
            flex-wrap: wrap;
            justify-content: center;
        }

        .books-hero h1 {
            font-size: 34px;
        }

        .form-grid {
            grid-template-columns: 1fr;
        }

        .list-header {
            flex-direction: column;
            align-items: flex-start;
        }

        .search-box {
            width: 100%;
        }

        .container {
            width: 92%;
        }

    }

</style>
```

</head>

<body>

```


<nav class="navbar">

    <div class="logo">
        NOVALIB
    </div>

    <ul class="nav-links">

        <li>
            <a href="index.html">Home</a>
        </li>

        <li>
            <a href="books.html" class="active">Books</a>
        </li>

        <li>
            <a href="members.html">Members</a>

        <li>
            <a href="issue.html">Issue</a>

        <li>

    </ul>

<section class="books-hero">

    <h1>Book Collection</h1>

    <p>
        Explore, manage and organize your library books easily.
    </p>

</section>



<main class="container">


    <!-- ADD BOOK -->

    <section class="card">

        <h2 class="card-title">
            Add New Book
        </h2>

        <div class="form-grid">

            <div class="form-group">
                <input
                    type="text"
                    id="title"
                    placeholder="Book Title"
                >
            </div>

            <div class="form-group">
                <input
                    type="text"
                    id="author"
                    placeholder="Author"
                >
            </div>

            <div class="form-group">
                <input
                    type="text"
                    id="category"
                    placeholder="Category"
                >
            </div>

            <div class="form-group">
                <input
                    type="number"
                    id="quantity"
                    placeholder="Quantity"
                >
            </div>

        </div>

        <button
            class="add-btn"
            onclick="addBook()"
        >
            + Add Book
        </button>

    </section>



    <section class="card">

        <div class="list-header">

            <h2 class="card-title">
                Book List
            </h2>

            <input
                type="text"
                id="search"
                class="search-box"
                placeholder="🔍 Search books..."
                onkeyup="displayBooks()"
            >

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Category</th>
                        <th>Quantity</th>
                        <th>Available</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="bookTable">

                </tbody>

            </table>

        </div>

    </section>

</main>



<script src="javascript.js"></script>
<script src="book.js"></script>
